<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Request Sent</title>
<style>
body{background:#0b1120;color:white;font-family:Arial;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;padding:10px;box-sizing:border-box;}
.box{text-align:center;padding:30px;border-radius:20px;background:rgba(15,23,42,0.9);border:1px solid #22c55e;max-width:340px;width:100%;}
h2{color:#22c55e;font-size:22px;}
p{color:#cbd5e1;font-size:14px;line-height:1.6;}
.timer{font-size:48px;font-weight:bold;color:#38bdf8;margin:15px 0;}
.wa{color:#25D366;font-weight:bold;text-decoration:none;font-size:16px;}
.info{background:rgba(34,197,94,0.1);border:1px solid #22c55e;border-radius:12px;padding:15px;margin:15px 0;}
</style>
</head>
<body>
<div class="box">
<h2>✅ Request Send Ho Gayi!</h2>
<div class="info">
<p>Aapki payment request admin ko bhej di gayi hai.<br>Admin approve karega tab internet khud ba khud shuru ho jayega.</p>
</div>
<div class="timer" id="timer">03:00</div>
<p>Agar 3 minute mein internet na mile tou WhatsApp karein:</p>
<a class="wa" href="#">📞 Contact Admin</a>
</div>
<script>
var s=180;
var t=setInterval(function(){
  var m=Math.floor(s/60);
  var sc=s%60;
  document.getElementById("timer").innerHTML=String(m).padStart(2,"0")+":"+String(sc).padStart(2,"0");
  if(--s<0){
    clearInterval(t);
    document.getElementById("timer").innerHTML="⌛ Admin se rabta karein";
  }
},1000);
</script>
</body>
</html>
